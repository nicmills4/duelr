name: Desktop Release

# Publishes a signed Windows build + the electron-updater feed (latest.yml) to the
# public monorepo's GitHub Releases. Triggered by pushing a desktop-v* tag whose
# version matches apps/desktop/package.json (e.g. desktop-v0.2.0).
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write # required for electron-builder to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a desktop-v* tag: build, sign, and publish the Release + latest.yml feed.
      - name: Build, sign & publish (tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm run release --workspace=apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # On a manual run: build (and sign, once configured) WITHOUT publishing a release.
      # --publish never is required so electron-builder doesn't try to reach GitHub
      # (its default "auto" attempts a publish/cleanup in CI and needs GH_TOKEN).
      - name: Build only (manual test)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        run: |
          npm run build
          npx electron-builder --win --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload installer artifact (manual test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: duelr-windows-installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

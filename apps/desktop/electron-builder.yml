appId: gg.playduelr.desktop
productName: Duelr
copyright: Copyright © 2025 Duelr
directories:
  buildResources: resources

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# Tray icons are loaded at runtime from process.resourcesPath/resources — they
# must be shipped as extraResources (buildResources above is only a build-time
# input dir). Without this the packaged app falls back to an EMPTY tray icon,
# which makes the window unreachable after close-to-tray.
extraResources:
  - from: resources
    to: resources

# Windows-only for now. League/LCU runs on Windows + macOS; mac is a later phase
# and gates on Apple signing + notarization, so it's intentionally omitted here.
win:
  executableName: Duelr
  icon: resources/tray-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # ── Phase 1: Azure Trusted Signing — uncomment + fill once the Azure account is live. ──
  # Creds are supplied via env in CI: AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET.
  # azureSignOptions:
  #   publisherName: Duelr
  #   endpoint: https://<region>.codesigning.azure.net/
  #   codeSigningAccountName: <trusted-signing-account>
  #   certificateProfileName: <certificate-profile>

nsis:
  artifactName: ${name}-setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

npmRebuild: false

# Auto-update feed → GitHub Releases on the public monorepo. Public repo means
# electron-updater needs no token, and CI publishes with the built-in GITHUB_TOKEN.
publish:
  provider: github
  owner: nicmills4
  repo: duelr
